name: CI

on:
    push:
        branches: [main]
        tags: ["*"]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}

env:
    PROJECT: kiririn.xcodeproj
    SCHEME: kiririn

jobs:
    lint:
        name: Lint & Format Check
        runs-on: macos-26
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Show Xcode version
              run: xcodebuild -version

            - name: swift-format lint
              run: |
                  xcrun swift-format lint --recursive --strict \
                    kiririn/ kiririnTests/ kiririnUITests/ Packages/

    build:
        name: Build ${{ matrix.platform.name }}
        needs: lint
        runs-on: macos-26
        timeout-minutes: 60
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - name: iOS
                      destination: "generic/platform=iOS"
                      id: ios
                    - name: macOS
                      destination: "generic/platform=macOS"
                      id: macos
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cache SPM packages
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/SourcePackages
                  key: spm-${{ hashFiles('kiririn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: ./web/bml/

            - name: Cache VLCKit
              id: vlckit-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./Packages/VLCKit/VLCKit.xcframework
                      ./Packages/VLCKit/VLCKitAssets/LicenseNotices/
                      ./Packages/VLCKit/VLCKitAssets/dodeca_and_7channel_3DSL_HRTF.sofa
                      ./kiririn/rounded-mplus-1m-wadalab-comp-arib.ttf
                  key: vlckit-${{ hashFiles('setup.sh') }}

            - name: Setup dependencies
              env:
                  VLCKIT_CACHE_HIT: ${{ steps.vlckit-cache.outputs.cache-hit }}
              run: ./setup.sh

            - name: Build archive
              run: |
                  git_commit_hash="$(git rev-parse --short=7 HEAD)"
                  archive_path="$RUNNER_TEMP/${{ matrix.platform.id }}/kiririn-${{ matrix.platform.id }}.xcarchive"

                  echo "Archiving commit $git_commit_hash"
                  xcodebuild archive \
                    -project "$PROJECT" \
                    -scheme "$SCHEME" \
                    -destination "${{ matrix.platform.destination }}" \
                    -archivePath "$archive_path" \
                    -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                    -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
                    -skipPackagePluginValidation \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    KIRIRIN_GIT_COMMIT_HASH="$git_commit_hash"

                  app_path="$(find "$archive_path/Products/Applications" -type d -name '*.app' -print -quit)"
                  if [ -z "$app_path" ]; then
                    echo "::error::No .app found in $archive_path/Products/Applications"
                    exit 1
                  fi

                  if [ -f "$app_path/Contents/Info.plist" ]; then
                    info_plist="$app_path/Contents/Info.plist"
                  else
                    info_plist="$app_path/Info.plist"
                  fi

                  actual_git_hash="$(/usr/bin/plutil -extract KiririnGitCommitHash raw -o - "$info_plist" 2>/dev/null || true)"
                  if [ "$actual_git_hash" != "$git_commit_hash" ]; then
                    echo "::error::KiririnGitCommitHash is missing or incorrect in $info_plist (expected $git_commit_hash, got ${actual_git_hash:-<missing>})"
                    exit 1
                  fi

                  echo "Verified KiririnGitCommitHash=$actual_git_hash"

            - name: Create XCArchive ZIP
              run: |
                  ditto -c -k --sequesterRsrc --keepParent \
                    "$RUNNER_TEMP/${{ matrix.platform.id }}/kiririn-${{ matrix.platform.id }}.xcarchive" \
                    "$RUNNER_TEMP/kiririn-${{ matrix.platform.id }}.xcarchive.zip"

            - name: Upload XCArchive ZIP
              uses: actions/upload-artifact@v7
              with:
                  name: kiririn-${{ matrix.platform.id }}.xcarchive.zip
                  path: ${{ runner.temp }}/kiririn-${{ matrix.platform.id }}.xcarchive.zip
                  compression-level: 0
                  if-no-files-found: error
                  archive: false

            - name: Upload XCArchive ZIP to release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG_NAME: ${{ github.ref_name }}
                  ARCHIVE_ZIP: ${{ runner.temp }}/kiririn-${{ matrix.platform.id }}.xcarchive.zip
              run: |
                  if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
                    gh release create "$TAG_NAME" \
                      --title "$TAG_NAME" \
                      --notes "Release $TAG_NAME" \
                      || gh release view "$TAG_NAME" >/dev/null
                  fi

                  gh release upload "$TAG_NAME" "$ARCHIVE_ZIP" --clobber

    sentry-release:
        name: Sentry Release
        if: startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: macos-26
        timeout-minutes: 20
        permissions:
            contents: read
        env:
            SENTRY_ORG: ci7lus
            SENTRY_PROJECT: kiririn
            SENTRY_CLI_VERSION: 3.6.2
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Download iOS XCArchive
              uses: actions/download-artifact@v8
              with:
                  name: kiririn-ios.xcarchive.zip
                  path: ${{ runner.temp }}/sentry-archives/ios
                  skip-decompress: true

            - name: Download macOS XCArchive
              uses: actions/download-artifact@v8
              with:
                  name: kiririn-macos.xcarchive.zip
                  path: ${{ runner.temp }}/sentry-archives/macos
                  skip-decompress: true

            - name: Extract XCArchives
              run: |
                  for platform in ios macos; do
                    archive_zip="$RUNNER_TEMP/sentry-archives/$platform/kiririn-$platform.xcarchive.zip"
                    extract_dir="$RUNNER_TEMP/sentry-archives/$platform"

                    if [ ! -f "$archive_zip" ]; then
                      echo "::error::XCArchive ZIP not found: $archive_zip"
                      exit 1
                    fi

                    unzip -q "$archive_zip" -d "$extract_dir"
                  done

            - name: Resolve Sentry release metadata
              id: metadata
              run: |
                  archive_path="$RUNNER_TEMP/sentry-archives/ios/kiririn-ios.xcarchive"
                  app_path="$(find "$archive_path/Products/Applications" -type d -name '*.app' -print -quit)"
                  if [ -z "$app_path" ]; then
                    echo "::error::No iOS app found in $archive_path"
                    exit 1
                  fi

                  info_plist="$app_path/Info.plist"
                  bundle_identifier="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$info_plist")"
                  short_version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$info_plist")"
                  build_number="$(/usr/bin/plutil -extract CFBundleVersion raw -o - "$info_plist")"
                  release="${bundle_identifier}@${short_version}"

                  if [ "$GITHUB_REF_NAME" != "v$short_version" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match app version $short_version"
                    exit 1
                  fi

                  macos_app_path="$RUNNER_TEMP/sentry-archives/macos/kiririn-macos.xcarchive/Products/Applications/kiririn.app"
                  macos_info_plist="$macos_app_path/Contents/Info.plist"
                  macos_bundle_identifier="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$macos_info_plist")"
                  macos_short_version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$macos_info_plist")"

                  if [ "$bundle_identifier" != "$macos_bundle_identifier" ] || [ "$short_version" != "$macos_short_version" ]; then
                    echo "::error::iOS and macOS archives have different bundle or version metadata"
                    exit 1
                  fi

                  {
                    echo "bundle_identifier=$bundle_identifier"
                    echo "release=$release"
                    echo "build_number=$build_number"
                  } >> "$GITHUB_OUTPUT"
                  echo "Resolved Sentry release $release (iOS dist $build_number)"

            - name: Create and finalize Sentry release
              uses: getsentry/action-release@v3
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ env.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
              with:
                  release: ${{ steps.metadata.outputs.release }}
                  environment: production
                  finalize: true
                  set_commits: auto
                  ignore_missing: true

            - name: Install Sentry CLI
              env:
                  INSTALL_PATH: ${{ runner.temp }}/sentry-cli/sentry-cli
              run: |
                  mkdir -p "$(dirname "$INSTALL_PATH")"
                  curl https://sentry.io/get-cli/ -fsSL \
                    | INSTALL_PATH="$INSTALL_PATH" SENTRY_CLI_VERSION="$SENTRY_CLI_VERSION" sh
                  dirname "$INSTALL_PATH" >> "$GITHUB_PATH"

            - name: Upload iOS dSYMs
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ env.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
                  SENTRY_CLI_BIN: ${{ runner.temp }}/sentry-cli/sentry-cli
              run: ./misc/upload-dsym-sentry.sh "$RUNNER_TEMP/sentry-archives/ios/kiririn-ios.xcarchive"

            - name: Upload macOS dSYMs
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ env.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
                  SENTRY_CLI_BIN: ${{ runner.temp }}/sentry-cli/sentry-cli
              run: ./misc/upload-dsym-sentry.sh "$RUNNER_TEMP/sentry-archives/macos/kiririn-macos.xcarchive"

    package-test:
        name: Test Packages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        needs: lint
        runs-on: macos-26
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Run package tests
              run: |
                  swift test --package-path Packages/ARIBStandardKit
                  swift test --package-path Packages/ApkSignatureVerifierKit
                  swift test --package-path Packages/KppxKit

    test:
        name: Test ${{ matrix.platform.name }}
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        needs: lint
        runs-on: macos-26
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - name: iOS
                      destination: "platform=iOS Simulator"
                      id: ios
                      code_coverage: "NO"
                      only_testing: kiririnTests
                    - name: macOS
                      destination: "platform=macOS"
                      id: macos
                      code_coverage: "YES"
                      only_testing: ""
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cache SPM packages
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/SourcePackages
                  key: spm-${{ hashFiles('kiririn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

            - name: Cache VLCKit
              id: vlckit-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./Packages/VLCKit/VLCKit.xcframework
                      ./Packages/VLCKit/VLCKitAssets/LicenseNotices/
                      ./Packages/VLCKit/VLCKitAssets/dodeca_and_7channel_3DSL_HRTF.sofa
                      ./kiririn/rounded-mplus-1m-wadalab-comp-arib.ttf
                  key: vlckit-${{ hashFiles('setup.sh') }}

            - name: Setup dependencies
              env:
                  VLCKIT_CACHE_HIT: ${{ steps.vlckit-cache.outputs.cache-hit }}
              run: ./setup.sh

            - name: Run tests
              env:
                  PLATFORM_ID: ${{ matrix.platform.id }}
                  TEST_DESTINATION: ${{ matrix.platform.destination }}
                  TEST_CODE_COVERAGE: ${{ matrix.platform.code_coverage }}
                  TEST_ONLY_TARGET: ${{ matrix.platform.only_testing }}
                  TEST_RESULT_DIR: ${{ runner.temp }}/TestResults
                  TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/TestResults/kiririn-${{ matrix.platform.id }}-test.xcresult
              run: |
                  mkdir -p "$TEST_RESULT_DIR"

                  if [ "$PLATFORM_ID" = "ios" ]; then
                    SIMULATOR_UDID="$(
                      xcrun simctl list devices available --json | jq -er '
                        [
                          .devices
                          | to_entries
                          | map(select(.key | contains(".iOS-")))
                          | sort_by(.key | [scan("[0-9]+") | tonumber])
                          | reverse[]
                          | .value[]
                          | select(.isAvailable and (.name | startswith("iPhone")))
                          | .udid
                        ][0] // error("No available iOS Simulator found")
                      '
                    )"
                    TEST_DESTINATION="platform=iOS Simulator,id=$SIMULATOR_UDID"
                  fi

                  TEST_SELECTION_ARGS=()
                  if [ -n "$TEST_ONLY_TARGET" ]; then
                    TEST_SELECTION_ARGS+=("-only-testing:$TEST_ONLY_TARGET")
                  fi

                  xcodebuild test \
                    -project "$PROJECT" \
                    -scheme "$SCHEME" \
                    -destination "$TEST_DESTINATION" \
                    -destination-timeout 120 \
                    -enableCodeCoverage "$TEST_CODE_COVERAGE" \
                    -showBuildTimingSummary \
                    -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                    -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
                    -skipPackagePluginValidation \
                    -resultBundlePath "$TEST_RESULT_BUNDLE_PATH" \
                    "${TEST_SELECTION_ARGS[@]}" \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="" \
                    COMPILER_INDEX_STORE_ENABLE=NO

            - name: Upload test result bundle
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: kiririn-${{ matrix.platform.id }}-test-results
                  path: ${{ runner.temp }}/TestResults/*.xcresult
                  compression-level: 0
                  if-no-files-found: warn

    complete:
        name: Complete
        needs: [lint, build, package-test, test]
        runs-on: ubuntu-latest
        steps:
            - run: echo "All jobs completed successfully."
